<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">

  <title>Frontend Mentor | Product preview card component</title>

</head>
<body>
  <main>
     <picture>
        <source media="(max-width: 400px)" srcset="images/image-product-mobile.jpg">
        <img src="images/image-product-desktop.jpg" alt="imagem pc">
          </picture>
              <header>
                  <h2>Perfume</h2>
                  <h1>Gabrielle Essence Eau De Parfum</h1>
                  <p>
                    A floral, solar and voluptuous interpretation composed by Olivier Polge,
                    Perfumer-Creator for the House of CHANEL.
                  </p>
                  <div class="caixa">
                    <h1 class="precoabaixo">$149.99</h1>
                    <h1 class="preco"><del>$169.99</del></h1>
                  </div>
                  <h1 class="cart">&#x1F6D2 Add to Cart</h1>
                    <div class="meunome">
              Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
              Coded by <a href="#">Bruno A. Q. Guimarães</a>.
   </div>
                
    
              </header>

  </main>
</body>
</html>
